# Native acceptance, digest layer. R only: no Python, no foreign toolkit, no oracle.
#
# This is the first increment of the acceptance spine. The shared-vector run, the vendoring
# audit and the draft-suite runs join it with the reader, in the follow-up PR of this stack;
# until then the tests here are the digest layer's own published-vector checks.
name: Native acceptance

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: R CMD check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        r: ["release"]
        include:
          - os: ubuntu-latest
            r: oldrel-3
    env:
      R_REMOTES_NO_ERRORS_FROM_WARNINGS: "true"
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.r }}
          use-public-rspm: true

      - name: Install the declared dependencies only
        run: install.packages(c("jsonlite", "testthat"))
        shell: Rscript {0}

      - name: Assert no foreign-language implementation is declared or called
        run: |
          Rscript -e '
            d <- read.dcf("DESCRIPTION")
            fields <- tolower(c("Imports", "Suggests", "LinkingTo", "SystemRequirements"))
            txt <- paste(unlist(d[, intersect(fields, colnames(d)), drop = TRUE]), collapse = " ")
            if (grepl("python|reticulate|virtualenv|conda", txt, ignore.case = TRUE)) {
              stop("DESCRIPTION names a foreign-language dependency: ", txt)
            }
            cat("declared dependencies:", txt, "\n")
          '
          Rscript -e '
            files <- list.files("R", pattern = "[.]R$", full.names = TRUE)
            code <- unlist(lapply(files, readLines, warn = FALSE))
            hits <- grep("system2\\(|system\\(|shell\\(|python", code, value = TRUE)
            if (length(hits)) {
              writeLines(hits)
              stop("R/ must not invoke an external process; found ", length(hits), " line(s)")
            }
            cat("no external-process calls in R/\n")
          '

      - name: Show what the compiled core is checked against
        run: |
          Rscript -e '
            # the load-time self-test is the guard against a miscompiled core: if it fails,
            # the package does not load at all, so this step is the whole test
            library(FAIRbioHeadersTools)
            cat("abc  ->", FAIRbioHeadersTools::bh_sha512_256_b64(charToRaw("abc")), "\n")
            cat("expect  UwSOJoGUHvmbLim3a0x9q+TC0MY0/G1G4OLxMQfnryM=\n")
            cat("loaded: the published 512/256 sample digests reproduced at load time\n")
          '

      - name: Build
        run: R CMD build .

      - name: R CMD check
        run: |
          mkdir -p "$RUNNER_TEMP/check-reports"
          tarball=$(ls FAIRbioHeadersTools_*.tar.gz)
          R CMD check --no-manual --output="$RUNNER_TEMP/check-reports" "$tarball" 2>&1 |
            tee "$RUNNER_TEMP/check-reports/check.log"
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            echo "::error::R CMD check failed with status $status"
            exit "$status"
          fi

      - name: Upload the check log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: check-${{ matrix.os }}-r${{ matrix.r }}
          path: ${{ runner.temp }}/check-reports
