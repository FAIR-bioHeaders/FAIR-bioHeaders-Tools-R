# Native acceptance: R only. This job is the acceptance path for this package.
#
# It installs an R runtime and the R packages this package declares, asserts that the package
# is native in structure rather than in intent (tools/assert_native.R), builds, runs
# R CMD check - which is where the shared-vector acceptance runs, because the suites are part
# of the package's tests - then audits the vendored bytes and writes the vector reports.
#
# It installs no Python, no fair-bioheaders, and no other foreign-language implementation.
# The reference differentials live in reference-differential.yaml: separate, supplemental,
# continue-on-error, and never a precondition for this job.
name: Native acceptance

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: R CMD check + shared vectors (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        r: ["release"]
        include:
          # the older release is the floor this package claims; the digest core is C99 and the
          # schema layer needs jsonvalidate >= 1.5.0 for its ajv 2020-12 path
          - os: ubuntu-latest
            r: oldrel-3
    env:
      R_REMOTES_NO_ERRORS_FROM_WARNINGS: "true"
    steps:
      - uses: actions/checkout@v4

      - name: Record the R runtime
        run: |
          which R Rscript || true
          R --version | head -2

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.r }}
          use-public-rspm: true

      - name: Install the declared dependencies only
        run: |
          install.packages(c("digest", "jsonlite", "jsonvalidate", "yaml", "testthat",
            "withr"))
        shell: Rscript {0}

      - name: Install (the tools scripts load the package; R CMD check does not)
        run: |
          R CMD build .
          R CMD INSTALL FAIRbioHeadersTools_0.1.0.tar.gz

      - name: Assert the package is native, structurally
        run: Rscript tools/assert_native.R

      - name: Audit the vendored upstream data against its provenance
        run: Rscript tools/check_vendoring.R

      - name: R CMD check
        run: |
          mkdir -p "$RUNNER_TEMP/check-reports"
          tarball=$(ls FAIRbioHeadersTools_*.tar.gz)
          rm -rf "$RUNNER_TEMP/check-reports/FAIRbioHeadersTools.Rcheck"
          R CMD check --no-manual --output="$RUNNER_TEMP/check-reports" "$tarball" 2>&1 |
            tee "$RUNNER_TEMP/check-reports/check.log"
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            echo "::error::R CMD check failed with status $status"
            exit "$status"
          fi

      - name: Shared-vector acceptance report
        run: |
          Rscript tools/run_conformance.R --report "$GITHUB_WORKSPACE/vector-report"
          Rscript tools/run_conformance.R --draft --report "$GITHUB_WORKSPACE/vector-report"
          Rscript tools/run_conformance.R --fhgm --report "$GITHUB_WORKSPACE/vector-report"

      - name: Show what the compiled core is checked against
        run: |
          # .onLoad() runs the published sample digests through the compiled core and refuses
          # to load the package when they disagree, so a successful library() call here is the
          # assertion; the printed value is what the reader compares against docs/DIGEST.md
          Rscript -e '
            library(FAIRbioHeadersTools)
            cat("abc    ->", bh_sha512_256_b64(charToRaw("abc")), "\n")
            cat("expect  UwSOJoGUHvmbLim3a0x9q+TC0MY0/G1G4OLxMQfnryM=\n")
            cat("digests: sha512-256 =", bh_digest_bytes("sha512-256"), "bytes;",
                "sha512 =", bh_digest_bytes("sha512"), "bytes\n")
            cat("engine:  ajv probe -",
                all(unlist(bh_dialect_probe())), "\n")
          '

      - name: Upload native reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.os }}-r${{ matrix.r }}
          path: |
            vector-report
            ${{ runner.temp }}/check-reports
