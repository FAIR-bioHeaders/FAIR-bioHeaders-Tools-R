# Native acceptance: R only. This job is the acceptance path for this package.
#
# It installs an R runtime and the R packages this package declares, builds the package,
# runs R CMD check (which runs the testthat suites, including the shared-vector acceptance
# run), then runs the vendoring audit and the command-line vector report. It installs no
# Python, no `fair-bioheaders`, and no other foreign-language implementation, and a guard
# step asserts that the package's own code never shells out to one. The reference-toolkit
# differential lives in reference-differential.yaml, separate and non-blocking.
name: Native acceptance

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: R CMD check + shared vectors (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        r: ["release"]
        include:
          # the older release is the floor this package claims; the digest core is C99 and
          # the schema layer needs jsonvalidate >= 1.5.0 for its ajv 2020-12 path
          - os: ubuntu-latest
            r: oldrel-3
    env:
      RHUB_PLATFORM: ${{ matrix.os }}
      # keep R's package cache off the workflow's critical path
      R_REMOTES_NO_ERRORS_FROM_WARNINGS: "true"
    steps:
      - uses: actions/checkout@v4

      - name: Record the R runtime
        run: |
          which R Rscript || true
          R --version | head -2

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.r }}
          use-public-rspm: true

      - name: Install the declared dependencies only
        run: |
          install.packages(c("digest", "jsonlite", "jsonvalidate", "yaml", "testthat",
                             "withr", "roxygen2"))
        shell: Rscript {0}

      - name: Assert no foreign-language implementation was installed
        run: |
          set -u
          # This job must not gain a Python or toolkit dependency. The check is on the R
          # library paths and on what the package declares, not on what the runner image
          # happens to ship.
          Rscript -e '
            libs <- unlist(.libPaths())
            present <- rownames(installed.packages(lib.loc = libs))
            stopifnot(!any(tolower(present) %in% c("reticulate", "minirustyr")))
            d <- read.dcf("DESCRIPTION")
            fields <- tolower(c("Imports", "Suggests", "LinkingTo", "SystemRequirements"))
            txt <- paste(unlist(d[, intersect(fields, colnames(d)), drop = TRUE]), collapse = " ")
            if (grepl("python|reticulate|virtualenv|conda", txt, ignore.case = TRUE)) {
              stop("DESCRIPTION names a foreign-language dependency: ", txt)
            }
            cat("declared dependencies:", txt, "\n")
          '
          # the package's own code must never shell out
          Rscript -e '
            files <- list.files("R", pattern = "[.]R$", full.names = TRUE)
            code <- unlist(lapply(files, readLines, warn = FALSE))
            hits <- grep("system2\\(|system\\(|shell\\(|sys\\.executable|python", code,
              value = TRUE
            )
            if (length(hits)) {
              writeLines(hits)
              stop("R/ must not invoke an external process; found ", length(hits), " line(s)")
            }
            cat("no external-process calls in R/\n")
          '

      - name: Audit the vendored upstream data against its provenance
        run: Rscript tools/check_vendoring.R

      - name: Build
        run: R CMD build .

      - name: R CMD check
        run: |
          tarball=$(ls FAIRbioHeadersTools_*.tar.gz)
          mkdir -p "$RUNNER_TEMP/check-reports"
          R CMD check --no-manual --output="$RUNNER_TEMP/check-reports" "$tarball" 2>&1 |
            tee "$RUNNER_TEMP/check-reports/R CMD check.log"
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            echo "::error::R CMD check failed with status $status"
            exit "$status"
          fi

      - name: Shared-vector acceptance report
        run: |
          Rscript tools/run_conformance.R --report "$GITHUB_WORKSPACE/vector-report"
          Rscript tools/run_conformance.R --draft --report "$GITHUB_WORKSPACE/vector-report"

      - name: Upload native reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.os }}-r${{ matrix.r }}
          path: |
            vector-report
            ${{ runner.temp }}/check-reports
