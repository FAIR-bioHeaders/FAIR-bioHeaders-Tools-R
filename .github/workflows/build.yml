name: build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # Primary acceptance: the released contracts, read natively, checked by R CMD check.
  # No Python and no foreign toolkit anywhere in this job - the only inputs are R, the
  # CRAN dependencies declared in DESCRIPTION, this repository (whose tests/conformance
  # bytes are vendored and digest-audited here, not fetched), and the toolchain.
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      _R_CHECK_FORCE_SUGGESTS_: false
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::testthat, any::jsonvalidate, any::roxygen2
          needs: check

      - name: Assert the acceptance path is native
        run: |
          # The package itself must not shell out to, embed or load another
          # implementation: no subprocess, no pipe, no foreign interpreter from R/
          # or src/. (tools/*.R are CI harness scripts, not installed code; the
          # harness uses git and curl only, never a foreign language runtime.)
          set -e
          if grep -rnE 'system2?\(|pipe\(|shell\.|reticulate|subprocess|python|openssl (dgst|enc)|callr' R/ src/ inst/ ; then
            echo "^ native acceptance must not invoke another implementation" >&2
            exit 1
          fi
          for f in requirements.txt pyproject.toml setup.py environment.yml Cargo.toml package.json pom.xml Project.toml DESCRIPTION.dev; do
            if [ -e "$f" ]; then
              echo "unexpected foreign project file in an R library: $f" >&2
              exit 1
            fi
          done
          if grep -nE 'SystemRequirements:.*(python|openssl)' DESCRIPTION ; then
            echo "the package must not declare a foreign runtime" >&2
            exit 1
          fi
          # and the vendored suite the run depends on is audited against its pins
          Rscript tools/check_vendoring.R

      - name: Assert no name is defined twice in R/
        run: |
          # Issue #12. Six names were defined twice on main - once in R/conditions.R or
          # R/framing.R, once in R/internals.R - and the earlier copies were dead code: with no
          # Collate: field R loads the alphabetically later file last, and that binding wins.
          # R reports nothing when a namespace binding is overwritten and `R CMD check` says
          # nothing about the duplication either (measured on a two-file control package: exit
          # 0, and the word "duplicate" appears nowhere in its log), so this static check is the
          # only thing between a merge and unreachable definitions. It parses the sources, so it
          # needs neither the install nor the compiled core. A duplicate fails the job.
          set -e
          Rscript tools/check_duplicate_defs.R --verbose

      - name: Assert the vendor record rotates its history only on change
        run: |
          # Review follow-up (#22). Re-running tools/vendor_upstream.R with unchanged
          # inputs must leave every `previous` field byte-identical; only a genuine
          # digest move rotates the predecessor. The script builds three throwaway
          # git repositories and runs the generator against them - including a suite-
          # manifest move, so rotate_suite's change branch is mutation-tested in both
          # lanes, not just the contract branch; tools/ is excluded
          # from the package tarball, so this proof lives beside the generator as a
          # build step, not in testthat - where R CMD check could only skip it, and
          # skips fail this job by design (docs/NATIVE-ACCEPTANCE.md).
          set -e
          Rscript tools/selftest_vendor_previous.R

      - name: Assert the draft-pin freshness guard parses JSON and can fail
        run: |
          # Issue #23. The freshness helper parses inst/VENDORED.json with jsonlite::fromJSON
          # by exact object path (never grep or positional sed), verifies local vendored
          # copies first, and returns MOVED (exit 1), UNUSABLE (exit 2), or CURRENT (exit 0).
          set -e
          Rscript tools/draft_pin_freshness.R --self-test

      - name: Install
        run: |
          R CMD build .
          R CMD INSTALL FAIRbioHeadersTools_*.tar.gz

      - name: Test (unit + integration + shared vectors, with skip and count guards)
        run: |
          # Any failure, any error, ANY skip, or fewer than the floor of assertions
          # fails the build (docs/NATIVE-ACCEPTANCE.md). Floor raised 500 -> 700 with
          # the FHGM model lane and 700 -> 1000 with the 2026-11-18 draft re-pin: the
          # revision measures 1131 assertions locally (1046 before the re-pin; the
          # additions are the K1 carrier tests, the citation battery with its negative
          # selection assertions, and the five declared-class scoring controls), and
          # the floor is the
          # current real count rounded down, never a number nothing reaches.
          BH_MIN_TESTS=1000 BH_TESTS_RECEIPT=tests.properties Rscript tools/run_tests.R
          cat tests.properties
          for line in failed=0 errors=0 skipped=0; do
            grep -qxF "$line" tests.properties || { echo "expected $line" >&2; exit 1; }
          done

      - name: R CMD check (the spine)
        run: |
          # Issue #12, second half of the guard. `R CMD check` exits 0 while its own log carries
          # warnings: measured on main at 4611c2c (`Status: 1 NOTE`, exit 0) and by #11 at
          # 9827944f (`Status: 1 WARNING, 1 NOTE`, exit 0). Testing the exit status alone - which
          # is what the other leg in native-acceptance.yaml did - therefore cannot go red here,
          # so the log is kept and searched. A WARNING is a build failure.
          # NOTEs are printed, not gated: `--as-cran` always emits the "New submission" NOTE
          # until this package is actually submitted, and the macOS legs add a NOTE about pandoc
          # not being installed on the runner. Failing on those would be a permanently red button.
          set -e
          log="${RUNNER_TEMP:-.}/build-check.log"
          R CMD check --as-cran --no-manual FAIRbioHeadersTools_*.tar.gz 2>&1 | tee "$log"
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            echo "::error::R CMD check failed with status $status"
            exit "$status"
          fi
          if grep -nE '^(\*|\*\*\*) .*WARNING|^Status:.*WARNING' "$log"; then
            echo "::error::R CMD check reported a WARNING while exiting with status $status - see $log"
            exit 1
          fi
          echo "R CMD check: no WARNING in $log"
          grep -nE '^(\*|\*\*\*) .*NOTE|^Status:' "$log" || true

      - name: Assert the capability docs match the code
        run: |
          # docs/CAPABILITY-MATRIX.md is generated from bh_capability(); regenerate
          # and require no drift.
          set -e
          cp docs/CAPABILITY-MATRIX.md /tmp/matrix-committed.md
          Rscript tools/render_capability_matrix.R
          cmp /tmp/matrix-committed.md docs/CAPABILITY-MATRIX.md || {
            echo "docs/CAPABILITY-MATRIX.md is stale - re-run tools/render_capability_matrix.R" >&2
            exit 1
          }

      - name: Native acceptance (291-vector ledger + default-behavior golden)
        run: |
          BH_ACCEPTANCE_RECEIPT=acceptance-ledger.properties \
          BH_GOLDEN_RECEIPT=default-behavior-golden.properties \
            Rscript tools/acceptance_native.R

      - name: Assert the acceptance ledger accounts for every shared vector
        run: |
          # The ledger is the completeness claim: all 291 shared vectors accounted
          # for, 228 run here, 63 declared not-run each with its reason. A stale
          # declared count is a build failure, never a quiet pass. Fixed-string line
          # comparison, so no value here is produced by parsing the file it checks.
          set -e
          receipt=acceptance-ledger.properties
          if [ ! -s "$receipt" ]; then
            echo "missing $receipt - acceptance_native.R did not write it" >&2
            exit 1
          fi
          cat "$receipt"
          cat > "${RUNNER_TEMP:-.}/ledger-expected.txt" <<'EXPECTED'
          available=true
          vectorsTotal=291
          vectorsRun=228
          vectorsPassed=228
          historicalPayloadsRun=159
          canonicalCounterpartsRun=69
          vectorsFailed=0
          vectorsNotRun=63
          vectorsDeclaredNotRunWithReason=63
          fasta=98/98 passed, 0 not run
          gfa=56/56 passed, 0 not run
          fhp-fasta=36/36 passed, 0 not run
          fhgff3=38/38 passed, 0 not run
          microdata=0/26 passed, 26 not run
          jsonld=0/37 passed, 37 not run
          EXPECTED
          missing=0
          while IFS= read -r line; do
            grep -qxF "$line" "$receipt" || { echo "ledger: no '$line' line" >&2; missing=1; }
          done < "${RUNNER_TEMP:-.}/ledger-expected.txt"
          if [ "$missing" -ne 0 ]; then
            echo "the acceptance ledger does not match the declared v0.6.0 baseline" >&2
            exit 1
          fi

      - name: Assert the default-behavior golden compared everything
        run: |
          set -e
          receipt=default-behavior-golden.properties
          if [ ! -s "$receipt" ]; then
            echo "missing $receipt - the golden comparison did not run" >&2
            exit 1
          fi
          cat "$receipt"
          for pair in vectorsCompared=291 documentsCompared=228 selectionCasesCompared=32 goldenDifferences=0; do
            key=${pair%%=*}; want=${pair##*=}
            got=$(sed -n "s/^$key=//p" "$receipt")
            if [ "$got" != "$want" ]; then
              echo "$key=$got, expected $want" >&2
              exit 1
            fi
          done

      - name: Upload native reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-acceptance-${{ matrix.os }}
          path: |
            tests.properties
            acceptance-ledger.properties
            default-behavior-golden.properties
          if-no-files-found: error

  # Rule V7 evidence, separate and labelled: the pinned FHT development contract and
  # its own 82-vector suite. Still native (R only, no Python). A pass here is "the
  # pinned draft bytes behave as their own suite expects through this reader", never
  # "FHT is supported": FHT has no released contract, no schemaVersion, no registry
  # row and no w3id URL (docs/CAPABILITY-MATRIX.md).
  draft-vectors:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    env:
      _R_CHECK_FORCE_SUGGESTS_: false
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::testthat, any::jsonvalidate
          needs: check
      - name: Install
        run: |
          R CMD build .
          R CMD INSTALL FAIRbioHeadersTools_*.tar.gz
      - name: Test the rule V7 draft lane
        run: |
          BH_DRAFT_RECEIPT=fht-draft-vectors.properties Rscript tools/acceptance_draft.R
      - name: Assert the draft suite ran in full, against the pinned bytes
        run: |
          # The receipt's counts and the identity of what was measured (contract
          # commit + digest, suite commit + manifest digest) are written by the R
          # run itself, which re-digests the vendored bytes against the registry pin
          # before reading a single vector (bh_draft_pins() / the runner's manifest
          # check). The literals below are a SECOND, independent statement of the
          # same pins: drift in either place fails the job.
          set -e
          receipt=fht-draft-vectors.properties
          if [ ! -s "$receipt" ]; then
            echo "missing $receipt - acceptance_draft.R did not write it" >&2
            exit 1
          fi
          cat "$receipt"
          grep -qx 'vectorsInManifest=82' "$receipt" || { echo "expected 82 vectors in the manifest" >&2; exit 1; }
          grep -qx 'vectorsRan=82' "$receipt" || { echo "expected 82 draft vectors to run" >&2; exit 1; }
          grep -qx 'vectorsPassed=82' "$receipt" || { echo "expected 82 draft vectors to pass" >&2; exit 1; }
          grep -qx 'contractCommit=86438f21c3a17a58334c97aed4955be1a2393522' "$receipt" \
            || { echo "the draft suite did not run against the pinned contract commit" >&2; exit 1; }
          grep -qx 'contractSha256=4156353aa6d077fee2d2c69be4e17859b8e4f81bb10824f3c87f6701de196e7a' "$receipt" \
            || { echo "the draft suite did not run against the pinned contract digest" >&2; exit 1; }
          grep -qx 'suiteCommit=86438f21c3a17a58334c97aed4955be1a2393522' "$receipt" \
            || { echo "the suite is not the pinned revision" >&2; exit 1; }
          grep -qx 'suiteManifestSha256=e5a4a5d027259e29a7e3cfb42da5e1ef07fa78d4a0e604ef73f28b8e5a59a508' "$receipt" \
            || { echo "the FHT suite manifest is not the pinned digest" >&2; exit 1; }
          grep -qx 'note=' "$receipt" || { echo "the receipt carries a note: $receipt" >&2; exit 1; }
      - name: Upload the FHT draft receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fht-draft-vectors-${{ matrix.os }}
          path: fht-draft-vectors.properties
          if-no-files-found: error

  # Rule V7 evidence, separate and labelled: the FHGM development suite. FHGM is not a
  # header type - its records are transported inside an FHGFF3 header under x-fhgm-models -
  # so this job compares the layers that suite publishes per vector (base, checksum, model)
  # and asserts that the model layer is compared only where the vector's own rule labels
  # are inside the scope this package evaluates (K1 transport, K2 record contract). A pass
  # here is draft evidence about pinned bytes, never "FHGM is supported": no schemaVersion,
  # no registry row, no w3id URL (docs/CAPABILITY-MATRIX.md).
  fhgm-draft-vectors:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    env:
      _R_CHECK_FORCE_SUGGESTS_: false
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::testthat, any::jsonvalidate
          needs: check
      - name: Install
        run: |
          R CMD build .
          R CMD INSTALL FAIRbioHeadersTools_*.tar.gz
      - name: Audit the vendored FHGM suite before running it
        run: Rscript tools/check_vendoring.R
      - name: Test the FHGM draft lane
        run: |
          BH_FHGM_RECEIPT=fhgm-draft-vectors.properties Rscript tools/acceptance_fhgm.R
      - name: Assert the FHGM suite ran in full, layer by layer
        run: |
          # As in the FHT job, the receipt is written by the R run itself, which re-digests
          # the vendored bytes against the registry pin before reading a single vector. The
          # literals below are a SECOND, independent statement of the same pins and counts:
          # drift in either place fails the job. 43 of the 62 vectors are deliberately NOT
          # run at the model layer - their verdicts turn on checker rules K3-K6/B1 that this
          # package does not implement - and an empty or shrinking model layer fails here.
          # The suite is pinned by digest first and count second: the manifest digest and
          # the vector count are both asserted, because a count alone cannot see a step
          # that changes bytes without changing the count.
          set -e
          receipt=fhgm-draft-vectors.properties
          if [ ! -s "$receipt" ]; then
            echo "missing $receipt - acceptance_fhgm.R did not write it" >&2
            exit 1
          fi
          cat "$receipt"
          cat > "${RUNNER_TEMP:-.}/fhgm-expected.txt" <<'EXPECTED'
          vectorsInManifest=62
          vectorsEvaluated=62
          vectorsRan=19
          vectorsPassed=19
          vectorsFailed=0
          vectorsNotRun=43
          vectorsNotRunWithReason=43
          vectorsNotRunUnlabelled=0
          baseLayerAgreement=62/62
          checksumLayerAgreement=62/62
          modelLayerCompared=19
          EXPECTED
          missing=0
          while IFS= read -r line; do
            grep -qxF "$line" "$receipt" || { echo "FHGM ledger: no '$line' line" >&2; missing=1; }
          done < "${RUNNER_TEMP:-.}/fhgm-expected.txt"
          grep -qx 'contractCommit=06176262f9824f26d974a15d8feeebde1fbeb0a8' "$receipt" \
            || { echo "the FHGM lane did not run against the pinned contract commit" >&2; missing=1; }
          grep -qx 'contractSha256=b7075e5872e0a5ffce5ae61c590ce182f1f219fa269413cad3b1a966753cfeae' "$receipt" \
            || { echo "the FHGM lane did not run against the pinned contract digest" >&2; missing=1; }
          grep -qx 'suiteCommit=06176262f9824f26d974a15d8feeebde1fbeb0a8' "$receipt" \
            || { echo "the FHGM suite is not the pinned revision" >&2; missing=1; }
          grep -qx 'suiteManifestSha256=e41f05fd8bb8b8ec175b0192b80832041c84e15c325876aa66a86ba6e59413ce' "$receipt" \
            || { echo "the FHGM suite manifest is not the pinned digest" >&2; missing=1; }
          grep -qx 'note=' "$receipt" || { echo "the receipt carries a note: $receipt" >&2; missing=1; }
          if [ "$missing" -ne 0 ]; then
            echo "the FHGM draft ledger does not match the pinned expectation" >&2
            exit 1
          fi
      - name: Upload the FHGM draft receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fhgm-draft-vectors-${{ matrix.os }}
          path: fhgm-draft-vectors.properties
          if-no-files-found: error

  # Draft-pin freshness, the check that earns its keep: the recorded commit and
  # SHA-256 against the owning repository's live default branch. Advisory by design -
  # a moved draft must be re-pinned deliberately, and released acceptance never
  # depends on it - so this job reports drift loudly without gating.
  draft-pin-freshness:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::digest, any::jsonlite
          needs: check
      - name: Self-test the freshness parser and failure controls
        run: Rscript tools/draft_pin_freshness.R --self-test
      - name: Compare the pinned draft bytes with live raw main
        run: Rscript tools/draft_pin_freshness.R

  # Supplemental differential, labelled and never the gate: the vendored digest core
  # against CPython hashlib. The PRIMARY job above installs no Python; this job
  # exists so the cross-implementation evidence recorded in docs/DIGEST.md is
  # reproducible in CI as well as on the study host.
  differential-supplemental:
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::jsonlite
          needs: check
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Hash the suite both ways and compare
        run: |
          # NOT an acceptance job: a pass here is agreement between two independent
          # standard implementations, recorded as supplemental evidence for the
          # digest decision (docs/DIGEST.md). Acceptance is the native ledger.
          set -e
          R CMD build . >/dev/null
          R CMD INSTALL FAIRbioHeadersTools_*.tar.gz >/dev/null
          python3 tools/differential_hashlib.py
          Rscript tools/differential_hashlib.R
