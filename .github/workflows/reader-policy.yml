name: Adopted reader policies
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          repository: FAIR-bioHeaders/FAIR-bioHeaders-Specification
          ref: 9b5269de0b00186718b07f42b0c48123341ff4de
          path: .policy
      - uses: r-lib/actions/setup-r@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2
      - run: Rscript -e 'install.packages(c("digest","jsonlite","jsonvalidate","yaml"))'
      - run: R CMD INSTALL .
      - run: Rscript tools/check_reader_policy_controls.R .policy/conformance/reader-policy
      - run: Rscript tools/acceptance_reader_policy.R .policy/conformance/reader-policy
